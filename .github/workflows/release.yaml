name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version
        id: normalize
        run: |
          # 1.0.0 or v1.0.0 -> v1.0.0
          VERSION="${{ inputs.version }}"
          VERSION="v${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Normalized version: ${VERSION}"

      - name: Validate version
        run: |
          INPUT_VERSION="${{ steps.normalize.outputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"
          if git rev-parse "refs/tags/${{ steps.normalize.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.normalize.outputs.version }} already exists. Delete it first to re-release."
            exit 1
          fi
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found. Proceeding with release."
            exit 0
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          HIGHER=$(printf '%s\n%s' "$LATEST_VERSION" "$INPUT_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$INPUT_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) must be >= latest version ($LATEST_VERSION)"
            exit 1
          fi
          echo "Version check passed: $INPUT_VERSION >= $LATEST_VERSION"

      - name: Update versions
        run: |
          VERSION="${{ steps.normalize.outputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version=\".*\"/version=\"${VERSION}\"/" addons/godot_xreal/plugin.cfg
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          # Sync the bumped crate version into Cargo.lock (workspace members only, with no dependency
          # bumps), so the lockfile can't drift from Cargo.toml (it did at v1.0.0).
          cargo update --workspace
          echo "plugin.cfg:"; grep '^version' addons/godot_xreal/plugin.cfg
          echo "Cargo.toml:"; grep '^version' Cargo.toml
          echo "Cargo.lock:"; grep -A1 '^name = "godot_xreal"' Cargo.lock

      - name: Upload version files as artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-commit
          path: |
            addons/godot_xreal/plugin.cfg
            Cargo.toml
            Cargo.lock

  # Real Android arm64 GDExtension. It needs no vendored XREAL libs, since they are dlopen'd at runtime, so
  # the release binary is self-contained (DT_NEEDED = libdl/libm/libc only).
  build-android:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply version updates
        uses: actions/download-artifact@v8
        with:
          name: version-commit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build
        run: |
          # Use the NDK preinstalled on the runner; any r27.x builds this fine, because the RE offsets are
          # runtime, vendored-lib dependent, not NDK-version dependent).
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using preinstalled NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a build --release
          cp target/aarch64-linux-android/release/libgodot_xreal.so .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-lib
          path: libgodot_xreal.so
          if-no-files-found: error

  # 6 desktop dummy stubs (freestanding; all targets cross-compile from one Linux runner via clang+lld).
  build-dummy:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate API docs
        # The dummy stubs #include dummy/stub_docs.inc + stub_members.inc (the editor F1 help),
        # generated from the `///` doc comments (needs a host Rust toolchain). Regenerate them here so
        # the shipped stubs embed the current docs and the release commits exactly what was built.
        run: bash scripts/gen_docs.sh

      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build dummy stubs
        run: |
          # build_dummy_libs.sh first regenerates dummy/stub_classes.inc from the Rust
          # source (scripts/gen_stub_classes.sh), then builds, so the stubs always ship
          # the current Node-derived class list. The regenerated .inc files (class list +
          # the F1 doc artifacts above) ride along in the artifact so the release job
          # commits exactly what was built.
          ./scripts/build_dummy_libs.sh
          mkdir -p out
          cp addons/godot_xreal/bin/windows/*.dll \
             addons/godot_xreal/bin/linux/*.so \
             addons/godot_xreal/bin/macos/*.dylib \
             dummy/stub_classes.inc dummy/stub_docs.inc dummy/stub_members.inc out/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dummy-stubs
          path: out/
          if-no-files-found: error

  release:
    needs: [prepare, build-android, build-dummy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Commit and push version bump + generated artifacts + tag
        run: |
          # Only reached when every build job succeeded. Commit the version bump together
          # with the regenerated auto-generated artifacts (the exact files the release was
          # built from): the dummy class list and the editor F1 doc artifacts. This is where
          # doc/dummy generation lands in the repo; CI only regenerates them and never commits.
          # Tag it, and push both with the branch.
          cp artifacts/version-commit/Cargo.toml Cargo.toml
          cp artifacts/version-commit/Cargo.lock Cargo.lock
          cp artifacts/version-commit/addons/godot_xreal/plugin.cfg addons/godot_xreal/plugin.cfg
          cp artifacts/dummy-stubs/stub_classes.inc dummy/stub_classes.inc
          cp artifacts/dummy-stubs/stub_docs.inc dummy/stub_docs.inc
          cp artifacts/dummy-stubs/stub_members.inc dummy/stub_members.inc
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addons/godot_xreal/plugin.cfg Cargo.toml Cargo.lock \
            dummy/stub_classes.inc dummy/stub_docs.inc dummy/stub_members.inc
          if git diff --cached --quiet; then
            echo "No version/generated-artifact changes needed (already in sync)"
          else
            git commit -m "chore(release): ${{ needs.prepare.outputs.version }}"
          fi
          git tag ${{ needs.prepare.outputs.version }}
          git push --tags origin main

      - name: Assemble release package
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          NAME="godot-xreal-${VER}"
          # Drop-in tree: extract over a Godot project, then vendor the XREAL libs (see INSTALL.md).
          mkdir -p "${NAME}/addons"
          cp LICENSE-MIT LICENSE-APACHE "${NAME}/"
          cp -r addons/godot_xreal "${NAME}/addons/"   # aar / tools / bin are gitignored -> not in the checkout
          # The .gdextension ships inside the addon (its res:// paths are absolute, so Godot does not
          # care where the file sits). One copy only: a root copy next to it would register the
          # extension twice.
          cp godot_xreal.gdextension godot_xreal.gdextension.uid "${NAME}/addons/godot_xreal/"
          # Built libraries into the addon's bin/ (Godot convention; the .gdextension points here).
          bin="${NAME}/addons/godot_xreal/bin"
          mkdir -p "$bin/android" "$bin/windows" "$bin/linux" "$bin/macos"
          cp artifacts/android-lib/libgodot_xreal.so "$bin/android/"
          # Desktop stubs sorted by extension: .dll -> windows, .so -> linux, .dylib -> macos.
          # (stub_classes.inc also rides in this artifact for the commit step; not copied here.)
          cp artifacts/dummy-stubs/*.dll "$bin/windows/"
          cp artifacts/dummy-stubs/*.so  "$bin/linux/"
          cp artifacts/dummy-stubs/*.dylib "$bin/macos/"
          cat > "${NAME}/INSTALL.md" <<'EOF'
          # Godot XREAL: prebuilt addon

          These are the prebuilt binaries (Android arm64 GDExtension + 6 desktop editor stubs). You do
          NOT need Rust / cargo-ndk / clang to use them.

          ## Install
          1. Copy this folder's contents into your Godot **4.7** project root, merging
             `addons/godot_xreal/` (`godot_xreal.gdextension` sits inside the addon, and the built
             libraries it references are in `addons/godot_xreal/bin/`).
          2. Enable the plugin: Project > Project Settings > Plugins > "Godot XREAL".
          3. Vendor the XREAL proprietary libraries (NOT redistributable, so not included) with the
             **XREAL Import** editor dock: pick `com.xreal.xr(.tgz|.tar.gz)`. Pin the SDK to the version
             these offsets were built against (**com.xreal.xr 3.1.0**).
          4. Android export: *Use Gradle Build* ON, Min SDK 29, Architectures arm64-v8a, renderer
             Compatibility (GLES3). Details are in the developer docs, indexed at docs/develop/README.md.
          EOF
          zip -r "${NAME}.zip" "${NAME}"
          echo "ARCHIVE=${NAME}.zip" >> $GITHUB_ENV

      - name: Assemble demo project
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          SRC="godot-xreal-${VER}"        # the addon tree assembled above, binaries already in place
          NAME="godot-xreal-demo-${VER}"
          # A complete Godot 4.7 project rather than a drop-in addon: extract it and open the folder
          # in the editor. project.godot already points run/main_scene at demo/main.tscn and enables
          # the plugin, so it runs as-is. The addon subtree is copied from the package assembled
          # above, so both archives ship byte-identical binaries.
          mkdir -p "${NAME}/scripts" "${NAME}/docs"
          cp -r "${SRC}/addons" "${NAME}/"   # brings godot_xreal.gdextension(+.uid) inside the addon
          cp "${SRC}/LICENSE-MIT" "${SRC}/LICENSE-APACHE" "${NAME}/"
          cp project.godot export_presets.cfg "${NAME}/"
          cp -r demo "${NAME}/"
          cp -r scripts/stream_server "${NAME}/scripts/"   # FPV receivers, run on the PC not in Godot
          cp -r docs/user/api "${NAME}/docs/"                   # generated class reference
          cat > "${NAME}/README.md" <<'EOF'
          # Godot XREAL: demo project

          A ready-to-run Godot **4.7** project: the addon with its prebuilt binaries, the feature
          demo, the FPV stream receivers and the generated class reference. You need no Rust,
          cargo-ndk or clang.

          ## Run it

          1. Open this folder in Godot 4.7 (Import, then pick `project.godot`).
          2. Press play. On desktop the extension loads as do-nothing stubs, so the scene runs but
             head tracking stays inert; that is expected.
          3. For the glasses, vendor the XREAL proprietary libraries first. They are not
             redistributable, so they are not included here. Use the **XREAL Import** editor dock in
             the left panel and pick `com.xreal.xr(.tgz|.tar.gz)`. Pin the SDK to the version these
             offsets were built against, **com.xreal.xr 3.1.0**.
          4. Export to Android with *Use Gradle Build* ON, Min SDK 29, architecture arm64-v8a and the
             Compatibility (GLES3) renderer. `export_presets.cfg` ships with those already set.

          ## What is here

          - `addons/godot_xreal/` the addon, with the Android arm64 GDExtension and the 6 desktop
            editor stubs already in `bin/`.
          - `demo/` the feature demo: `main.tscn` is the main scene, with the phone touch controller,
            the AR scene and one instance of every feature component.
          - `scripts/stream_server/` the FPV receivers. They run on a PC, not inside Godot: start one
            before pressing Stream in the app. See the README in that folder.
          - `docs/user/api/` every class the addon exposes to GDScript, one page each.

          Image tracking is the one feature that needs a build step: it wants a compiled
          reference-image database, which is SDK-derived and so absent here. Build one with the
          **XREAL Image DB** editor dock, or the toggle reports an error and flips itself back off.
          EOF
          zip -r demo.zip "${NAME}"
          echo "DEMO_ARCHIVE=demo.zip" >> $GITHUB_ENV

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ needs.prepare.outputs.version }} \
            --title "Release ${{ needs.prepare.outputs.version }}" \
            --notes-file CHANGELOG.md \
            "${{ env.ARCHIVE }}" \
            "${{ env.DEMO_ARCHIVE }}"
