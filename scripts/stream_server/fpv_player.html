<!DOCTYPE html>
<meta charset="utf-8">
<title>XREAL FPV</title>
<!--
  Served by fpv_server.py. The server sends an FLV stream over WebSocket and this page hands it to
  mpegts.js (Apache-2.0), which feeds it to Media Source Extensions - so the browser's own H.264 and
  AAC decoders do the decoding. Nothing here decodes, and nothing on the server does either.

  mpegts.js is loaded from a CDN. To run offline, drop mpegts.js next to this file and change the
  src to "mpegts.js" - the server serves only this page, so you would also add a route for it.
-->
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #111; color: #ddd;
         display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #status { color: #8b8; }
  #status.err { color: #e88; }
  main { flex: 1; display: grid; place-items: center; padding: 0 1rem 1rem; }
  #stage { width: 100%; max-width: 1280px; }
  /* The ratio is a placeholder until MEDIA_INFO reports the real one. */
  video { display: block; width: 100%; background: #000; aspect-ratio: var(--ratio, 16 / 9); }
  button { font: inherit; padding: .3rem .8rem; }
  button[aria-pressed="true"] { outline: 2px solid #8b8; }

  /* Theater: the video takes the whole width, the header stays. Sizing is left to flexbox rather
     than a calc() against the header height, which would go wrong the moment the header wraps. */
  body.theater main { padding: 0; place-items: stretch; min-height: 0; }
  body.theater #stage { max-width: none; display: grid; place-items: center; background: #000; }
  body.theater video { width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; }

  /* Fullscreen. Written twice on purpose: one unknown selector invalidates the whole rule, so the
     prefixed and unprefixed forms cannot share a block. */
  #stage:fullscreen { max-width: none; display: grid; place-items: center; background: #000; }
  #stage:fullscreen video { width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; }
  #stage:-webkit-full-screen { max-width: none; display: grid; place-items: center; background: #000; }
  #stage:-webkit-full-screen video { width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; }
</style>

<header>
  <h1>XREAL FPV</h1>
  <span id="status">connecting…</span>
  <button id="resync" title="rebuild the player">resync (r)</button>
  <button id="theater" aria-pressed="false" title="wide, with the header still visible">theater (t)</button>
  <button id="fullscreen" title="fill the screen; double-clicking the video does the same">fullscreen (f)</button>
  <label><input type="checkbox" id="mute" checked> mute (m)</label>
  <span id="diag"></span>
</header>
<main><div id="stage"><video id="v" autoplay muted playsinline></video></div></main>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
const video = document.getElementById('v');
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live';
let player = null;
let retryTimer = 0;

function say(text, isError) {
  status.textContent = text;
  status.classList.toggle('err', !!isError);
}

function start() {
  if (!window.mpegts || !mpegts.isSupported()) {
    say('mpegts.js unavailable - offline, or this browser has no MSE support', true);
    return;
  }
  stop();
  player = mpegts.createPlayer(
    { type: 'flv', isLive: true, url },
    // Chase the live edge: the server sends from the newest keyframe, and without this the
    // buffer grows every time the tab is backgrounded.
    { enableStashBuffer: false, liveBufferLatencyChasing: true, liveBufferLatencyMaxLatency: 1.5 }
  );
  // The server disconnects everyone when the app restarts its stream, so a lost connection is
  // routine rather than fatal - come back and pick up the new session.
  player.on(mpegts.Events.ERROR, (type, detail) => {
    say(`${type}: ${detail} - reconnecting…`, true);
    retry();
  });
  // A closed connection is not an error to mpegts.js - it reports LOADING_COMPLETE and calls
  // endOfStream(), after which the element plays out the stale buffer and never comes back. For a
  // live stream that is always a disconnection, so treat it the same as an error.
  player.on(mpegts.Events.LOADING_COMPLETE, () => { say('stream ended - reconnecting…'); retry(); });
  player.on(mpegts.Events.MEDIA_INFO, info => {
    say(`${info.width}x${info.height} - ${info.audioCodec || 'no audio'}`);
    // Adopt the real shape. Until this arrives the element is a 16:9 placeholder, so a stream that
    // is not 16:9 sits letterboxed inside a box of the wrong size.
    if (info.width && info.height) stage.style.setProperty('--ratio', `${info.width} / ${info.height}`);
  });
  player.attachMediaElement(video);
  player.load();
  say('waiting for the app to stream…');
  // Do not just play() once here: at this point the element has no data, and a play() that lands on
  // an empty buffer can be left paused when frames finally arrive — which looks exactly like a
  // frozen first frame. Ask again whenever the element says it has something.
  tryPlay();
}

function retry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(start, 1000);
}

// Last resort: if the picture is frozen while the stream is supposed to be live, rebuild. Covers
// the cases neither event catches - a MediaSource that ended quietly, or playback wedged behind an
// unreachable buffer.
let lastSeen = -1, stalledFor = 0;
setInterval(() => {
  if (!player || !video.buffered.length) { stalledFor = 0; return; }
  const ms = player._msectl && player._msectl._mediaSource;
  const stuck = video.currentTime === lastSeen && !video.paused;
  lastSeen = video.currentTime;
  stalledFor = stuck ? stalledFor + 1 : 0;
  if (stalledFor >= 5 || (ms && ms.readyState === 'ended')) {
    stalledFor = 0;
    say('stalled - reconnecting…', true);
    retry();
  }
}, 1000);

function tryPlay() {
  if (!video.paused) return;
  video.play().catch(err => {
    if (err && err.name === 'NotAllowedError') say('click the video to start playback', true);
  });
}

['loadeddata', 'canplay', 'progress', 'stalled', 'waiting'].forEach(
  ev => video.addEventListener(ev, tryPlay));
video.addEventListener('click', tryPlay);

// mpegts.js defers everything until the MediaSource opens (deferLoadAfterSourceOpen), and Chrome
// will not open one for a hidden tab — so a page opened in the background, or backgrounded before
// the app started streaming, sits there forever with nothing buffered. Rebuild when it comes back.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !player) return;
  const ms = player._msectl && player._msectl._mediaSource;
  if (ms && ms.readyState !== 'open') start();
});

// The picture freezing while data keeps arriving is the failure worth naming, so report the numbers
// that distinguish it: currentTime stuck with buffered growing means playback never advanced, while
// buffered stuck at 0 means nothing was ever demuxed.
setInterval(() => {
  const end = video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
  const ms = player && player._msectl && player._msectl._mediaSource;
  document.getElementById('diag').textContent =
    `t=${video.currentTime.toFixed(1)}s buffered=${end.toFixed(1)}s ready=${video.readyState}` +
    ` mse=${ms ? ms.readyState : '-'}${video.paused ? ' PAUSED' : ''}`;
}, 500);

function stop() {
  if (!player) return;
  // mpegts.js wants the full teardown, in this order. Calling destroy() alone leaves the old
  // MediaSource attached to the element, and the next attachMediaElement() then quietly does
  // nothing — which is why "resync" did not recover a stalled stream.
  try { player.pause(); player.unload(); player.detachMediaElement(); } catch (e) { /* already gone */ }
  player.destroy();
  player = null;
}

document.getElementById('resync').onclick = start;

const muteBox = document.getElementById('mute');

// Routed through one function so the checkbox and the keyboard cannot disagree: assigning
// `checked` fires no change event, so a key that only flipped the box would leave the element
// unmuted while the UI claimed otherwise.
function setMute(on) {
  muteBox.checked = on;
  video.muted = on;
}
muteBox.onchange = e => setMute(e.target.checked);

// --------------------------------------------------------------------------------------------
// Theater and fullscreen
// --------------------------------------------------------------------------------------------

const theaterBtn = document.getElementById('theater');
const fsBtn = document.getElementById('fullscreen');
const THEATER_KEY = 'xreal-fpv-theater';

function setTheater(on) {
  document.body.classList.toggle('theater', on);
  theaterBtn.setAttribute('aria-pressed', String(on));
  // Remembered, because this is a monitor you leave open: having to re-widen it on every reload,
  // and after every reconnect-driven refresh, gets old fast.
  try { localStorage.setItem(THEATER_KEY, on ? '1' : '0'); } catch (e) { /* private mode */ }
}

function isTheater() { return document.body.classList.contains('theater'); }

// Fullscreen is prefixed on older WebKit, and iOS Safari refuses to fullscreen a container at all -
// only the video element itself, through its own non-standard entry point.
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function toggleFullscreen() {
  if (fullscreenElement()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
    return;
  }
  const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (request) {
    const r = request.call(stage);
    if (r && r.catch) r.catch(() => {});   // rejected without a user gesture; nothing to recover
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
}

theaterBtn.onclick = () => setTheater(!isTheater());
fsBtn.onclick = toggleFullscreen;
// Double-click the picture, the way every video site behaves. The single clicks it also fires are
// harmless: tryPlay() returns immediately unless playback is actually paused.
video.addEventListener('dblclick', toggleFullscreen);

['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    const on = !!fullscreenElement();
    fsBtn.textContent = on ? 'exit fullscreen (f)' : 'fullscreen (f)';
    fsBtn.setAttribute('aria-pressed', String(on));
  }));

document.addEventListener('keydown', e => {
  // Let the browser keep its own shortcuts - ctrl+r reloads, ctrl+t opens a tab.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Only text entry is off limits. Excluding every control would mean 'm' stops working the moment
  // you click the mute box - which is exactly when you are most likely to press it again - and a
  // letter does nothing to a checkbox or a button anyway. Space still reaches them untouched.
  const el = e.target;
  const tag = el && el.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT' ||
      (tag === 'INPUT' && !/^(checkbox|radio|button|submit|reset)$/i.test(el.type))) return;
  switch (String(e.key).toLowerCase()) {
    case 't': setTheater(!isTheater()); break;
    case 'f': toggleFullscreen(); break;
    case 'r': start(); break;
    case 'm': setMute(!muteBox.checked); break;
    default: return;
  }
  e.preventDefault();
});

try { setTheater(localStorage.getItem(THEATER_KEY) === '1'); } catch (e) { /* private mode */ }

start();
</script>
